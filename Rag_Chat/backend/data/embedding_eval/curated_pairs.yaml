hard_negative:
  # negation — 어휘 겹치는데 부정/긍정 반전
  - {text1: "휴가 신청 승인", text2: "휴가 신청 거부", category: hr, tags: [negation]}
  - {text1: "출장 가능", text2: "출장 불가", category: hr, tags: [negation]}
  - {text1: "월급 인상", text2: "월급 동결", category: hr, tags: [antonym]}
  - {text1: "매출 증가", text2: "매출 감소", category: finance, tags: [antonym]}
  - {text1: "VPN 접속 성공", text2: "VPN 접속 실패", category: it, tags: [negation]}
  - {text1: "비밀번호 일치", text2: "비밀번호 불일치", category: it, tags: [negation]}
  - {text1: "예산 승인", text2: "예산 반려", category: finance, tags: [negation]}
  - {text1: "계약 체결", text2: "계약 파기", category: legal, tags: [antonym]}

  # homonym — 같은 단어 다른 의미
  - {text1: "사과를 먹다", text2: "사과를 받다", category: general, tags: [homonym]}     # 과일 vs apology
  - {text1: "은행에서 인출", text2: "강 옆 은행나무", category: general, tags: [homonym]}   # bank vs tree
  - {text1: "회사 차를 마시다", text2: "회사 차를 운전하다", category: general, tags: [homonym]} # tea vs car

  # 같은 도메인이나 의미 미세 차이 (lexical overlap, semantic shift)
  - {text1: "연차 휴가", text2: "연차 평가", category: hr, tags: [semantic_shift]}        # 휴가 vs 인사평가
  - {text1: "출장비 한도", text2: "출장지 한도", category: hr, tags: [semantic_shift]}     # 비용 vs 지역
  - {text1: "분기 매출", text2: "분기 회의", category: finance, tags: [semantic_shift]}
  - {text1: "약관 동의", text2: "약관 위반", category: legal, tags: [antonym]}
  - {text1: "재택근무 가능", text2: "재택근무 금지", category: hr, tags: [negation]}

  # 다국어 false friend
  - {text1: "salary 조정", text2: "celery 조달", category: general, tags: [false_friend]}  # 영문 단어 발음 유사

