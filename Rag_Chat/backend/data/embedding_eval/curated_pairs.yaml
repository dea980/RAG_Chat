  - {text1: "연차 휴가 신청", text2: "VPN 접속 오류 해결", category_pair: [hr, it], tags: []}
  - {text1: "출장비 정산", text2: "비밀번호 재설정", category_pair: [hr, it], tags: []}
  - {text1: "3분기 매출 보고", text2: "재택근무 신청서", category_pair: [finance, hr], tags: []}
  - {text1: "법인카드 한도", text2: "이메일 첨부파일 차단", category_pair: [finance, it], tags: []}
  - {text1: "근로계약 해지", text2: "분기 예산 편성", category_pair: [legal, finance], tags: []}
  - {text1: "약관 동의 철회", text2: "회의실 예약", category_pair: [legal, general], tags: []}
  - {text1: "2단계 인증 설정", text2: "퇴직금 지급일", category_pair: [it, hr], tags: []}
  - {text1: "월차 며칠 남았나요", text2: "회계연도 마감일", category_pair: [hr, finance], tags: []}
