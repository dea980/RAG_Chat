<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사내 복리후생 안내 (샘플)</title>
</head>
<body>
  <h1>사내 복리후생 안내</h1>

  <h2>1. 연차 휴가</h2>
  <p>입사 1년 미만 직원은 매월 1일의 유급휴가가 주어진다.
     입사 1년 이상 직원은 연 15일의 유급휴가가 주어지며, 근속 기간에 따라 가산된다.</p>

  <h2>2. 경조사 지원</h2>
  <h3>2.1 결혼</h3>
  <p>본인 결혼 시 5일의 유급휴가와 축의금 50만원을 지원한다.</p>

  <h3>2.2 출산</h3>
  <p>배우자 출산 시 10일의 유급휴가가 주어진다.</p>

  <h2>3. 건강검진</h2>
  <p>매년 1회 종합건강검진을 회사 비용으로 지원한다.</p>

  <h2>4. 교육 지원</h2>
  <p>업무 관련 교육비는 연 200만원 한도 내에서 지원한다.</p>
</body>
</html>
